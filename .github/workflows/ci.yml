name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"
      - run: bun install --frozen-lockfile
      - name: Run Oxlint
        run: bun run lint

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.3"
          cache: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"
      - run: bun install --frozen-lockfile
      - run: make test
      - run: go test -race ./...
      - name: Check Go formatting
        run: test -z "$(gofmt -l $(find . -name '*.go' -not -path './vendor/*'))"
      - name: Run Go vet
        run: go vet ./...
      - name: Check repository conventions
        run: go test ./test/convention
      - name: Check web formatting
        run: bun run format:check
      - name: Check web types
        run: bun run --cwd web typecheck
      - name: Verify generated code
        run: make generate && git diff --exit-code

  federation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Black-box federation and realtime proof
        run: make e2e-federation
