name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.3"
          cache: true
      - run: go test ./...
      - run: go test -race ./...
      - run: go vet ./...
      - name: Verify generated code
        run: make generate && git diff --exit-code
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Enforce panic policy
        run: test -z "$(find . -name '*.go' -exec grep -HnF 'panic(' {} + | grep -Ev '^./internal/(config/config|di/providers|database/migration/migration)\.go:' || true)"
