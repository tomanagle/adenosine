name: ${ADENOSINE_COMPOSE_PROJECT:-adenosine-production}

x-app-environment: &app-environment
  DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
  ADENOSINE_BASE_URL: ${ADENOSINE_BASE_URL}
  ADENOSINE_LISTEN_ADDR: :8080
  ADENOSINE_REPO_ROOT: /var/lib/adenosine/repos
  ADENOSINE_RELEASE_ASSET_ROOT: /var/lib/adenosine/state/release-assets
  ADENOSINE_GIT_BINARY: git
  ADENOSINE_SSH_LISTEN_ADDR: :2222
  ADENOSINE_SSH_HOST: ${ADENOSINE_SSH_HOST}
  ADENOSINE_SSH_PORT: ${ADENOSINE_SSH_PORT}
  ADENOSINE_SSH_HOST_KEY_PATH: /var/lib/adenosine/state/ssh_host_ed25519_key
  ADENOSINE_OAUTH_STATE_KEY: ${ADENOSINE_OAUTH_STATE_KEY}
  ADENOSINE_OAUTH_CREDENTIAL_KEY: ${ADENOSINE_OAUTH_CREDENTIAL_KEY}
  ADENOSINE_TAP_CONSUMER: ${ADENOSINE_TAP_CONSUMER:-}
  ADENOSINE_TAP_ADMIN_PASSWORD: ${TAP_ADMIN_PASSWORD}
  ADENOSINE_ELECTRIC_URL: ${ADENOSINE_ELECTRIC_URL:-}
  ADENOSINE_ELECTRIC_SECRET: ${ADENOSINE_ELECTRIC_SECRET:-}
  OTEL_SERVICE_NAME: adenosine
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  OTEL_RESOURCE_ATTRIBUTES: deployment.environment.name=production,service.version=${ADENOSINE_VERSION}
  OTEL_TRACES_SAMPLER: parentbased_traceidratio
  OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-0.10}

services:
  caddy:
    image: docker.io/library/caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    restart: unless-stopped
    environment:
      ADENOSINE_DOMAIN: ${ADENOSINE_DOMAIN}
    ports:
      - "${ADENOSINE_HTTP_PORT:-80}:80"
      - "${ADENOSINE_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
      web:
        condition: service_healthy

  app:
    image: ${ADENOSINE_IMAGE}:${ADENOSINE_VERSION}
    restart: unless-stopped
    command: ["serve"]
    environment: *app-environment
    ports:
      - "${ADENOSINE_SSH_PORT}:2222"
    volumes:
      - repositories:/var/lib/adenosine/repos
      - instance_state:/var/lib/adenosine/state
    read_only: true
    tmpfs:
      - /tmp:exec,size=512m
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/health/ready"]
      interval: 15s
      timeout: 3s
      retries: 20
      start_period: 10s

  web:
    image: ${ADENOSINE_IMAGE}:${ADENOSINE_VERSION}
    restart: unless-stopped
    entrypoint: ["bun", "/opt/adenosine/web/server/index.mjs"]
    command: []
    environment:
      ADENOSINE_INTERNAL_API_URL: http://app:8080
      PORT: "3000"
    read_only: true
    tmpfs:
      - /tmp
      - /home/adenosine:uid=100,gid=101,mode=0700
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 3s
      retries: 20

  postgres:
    image: docker.io/library/postgres:17.5-alpine3.21@sha256:5d004e058f520673f1f6edbad6b1603d5dab4c818e257c041889ef64672a8cc4
    restart: unless-stopped
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=5", "-c", "max_wal_senders=5", "-c", "max_slot_wal_keep_size=1GB"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 30

  electric:
    profiles: ["electric"]
    image: docker.io/electricsql/electric:1.7.10@sha256:5758f72b40d2ea9c3ba676b0f6070dd5cd5552975c19b2b8f82206743f47164c
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://electric:${ELECTRIC_DATABASE_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      ELECTRIC_SECRET: ${ELECTRIC_SECRET}
      ELECTRIC_PORT: "3000"
      ELECTRIC_DB_POOL_SIZE: "10"
      ELECTRIC_MANUAL_TABLE_PUBLISHING: "true"
      ELECTRIC_STORAGE_DIR: /var/lib/electric/persistent
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_SERVICE_NAME: electric
    volumes:
      - electric_data:/var/lib/electric/persistent
    depends_on:
      postgres:
        condition: service_healthy

  tap:
    profiles: ["tap"]
    image: ghcr.io/bluesky-social/indigo/tap:0.1.10@sha256:5e20bfe416d29fcd215ed8bf99f10b2ab825a6de4e5599846dd33967ade2abeb
    restart: unless-stopped
    environment:
      TAP_DATABASE_URL: sqlite:///data/tap.db
      TAP_SIGNAL_COLLECTION: dev.adenosine.repo
      TAP_COLLECTION_FILTERS: dev.adenosine.*
      TAP_WEBHOOK_URL: http://app:8080/internal/federation/tap
      TAP_NO_REPLAY: "false"
      TAP_DISABLE_ACKS: "false"
      TAP_ADMIN_PASSWORD: ${TAP_ADMIN_PASSWORD}
    volumes:
      - tap_data:/data
    depends_on:
      app:
        condition: service_healthy

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.130.1@sha256:9c247564e65ca19f97d891cca19a1a8d291ce631b890885b44e3503c5fdb3895
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./otel-collector.yml:/etc/otelcol-contrib/config.yaml:ro
    healthcheck:
      test: ["CMD", "/otelcol-contrib", "validate", "--config=/etc/otelcol-contrib/config.yaml"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  repositories:
  instance_state:
  caddy_data:
  caddy_config:
  electric_data:
  tap_data:
