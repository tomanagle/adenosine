      "ExactOrigin": { "name": "Origin", "in": "header", "required": false, "description": "Required by the operation and must exactly match the configured Adenosine origin. The comparison uses the browser-serialized origin: scheme and host, with the default port omitted and no path or trailing slash.", "schema": { "type": "string", "format": "uri" } },
      "IdempotencyKey": { "name": "Idempotency-Key", "in": "header", "required": false, "schema": { "type": "string", "minLength": 1, "maxLength": 255 } },
      "Limit": { "name": "limit", "in": "query", "required": false, "schema": { "type": "integer", "minimum": 1, "maximum": 100, "default": 30 } },
      "Cursor": { "name": "cursor", "in": "query", "required": false, "schema": { "type": "string" } },
      "SearchQuery": { "name": "q", "in": "query", "required": true, "description": "UTF-8 text matched against fields documented by the operation", "schema": { "type": "string", "minLength": 1, "maxLength": 200 } },
      "SearchSort": { "name": "sort", "in": "query", "required": false, "schema": { "type": "string", "enum": ["relevance", "recent"], "default": "relevance" } },
      "SearchLimit": { "name": "limit", "in": "query", "required": false, "schema": { "type": "integer", "minimum": 1, "maximum": 50, "default": 20 } },
      "SearchCursor": { "name": "cursor", "in": "query", "required": false, "description": "Opaque keyset cursor bound to the operation, query, and sort", "schema": { "type": "string", "maxLength": 4096 } }
      ,"ElectricOffset": { "name": "offset", "in": "query", "required": true, "description": "Electric shape-log offset. Use -1 for an initial sync or the electric-offset response header for continuation.", "schema": { "type": "string", "minLength": 1, "maxLength": 255 } }
      ,"ElectricHandle": { "name": "handle", "in": "query", "required": false, "description": "Electric shape handle required for continuation offsets.", "schema": { "type": "string", "maxLength": 255 } }
      ,"ElectricCursor": { "name": "cursor", "in": "query", "required": false, "description": "Electric cache-busting cursor returned by a prior live request.", "schema": { "type": "string", "maxLength": 255 } }
      ,"ElectricCacheBuster": { "name": "cache-buster", "in": "query", "required": false, "description": "Electric stale-cache recovery token.", "schema": { "type": "string", "maxLength": 255 } }
      ,"ElectricExpiredHandle": { "name": "expired_handle", "in": "query", "required": false, "description": "Electric shape handle being replaced during stale-shape recovery.", "schema": { "type": "string", "maxLength": 255 } }
      ,"ElectricLive": { "name": "live", "in": "query", "required": false, "description": "Wait for a long-poll response.", "schema": { "type": "boolean" } }
      ,"ElectricLiveSSE": { "name": "live_sse", "in": "query", "required": false, "description": "Use Electric server-sent events; requires live=true.", "schema": { "type": "boolean" } }
      ,"ElectricReplica": { "name": "replica", "in": "query", "required": false, "schema": { "type": "string", "enum": ["default", "full"] } }
      ,"ElectricLog": { "name": "log", "in": "query", "required": false, "schema": { "type": "string", "enum": ["full", "changes_only"] } }
