{
  "openapi": "3.0.3",
  "info": {
    "title": "Adenosine API",
    "version": "0.1.0",
    "description": "The stable public contract for Adenosine clients. REST is the canonical write path and remains fully functional without realtime sync."
  },
  "servers": [{ "url": "/" }],
  "tags": [
    { "name": "Health" },
    { "name": "Identity" },
    { "name": "Owners", "description": "Resolution for the shared public namespace used by account, organization, and repository URLs." },
    { "name": "Profiles" },
    { "name": "Organizations" },
    { "name": "Repositories" },
    { "name": "Credentials" },
    { "name": "Passkeys" },
    { "name": "Issues" },
    { "name": "Pull Requests" },
    { "name": "Comments" },
    { "name": "Notifications", "description": "Private, host-derived inbox activity. Notification state is local and is not federated." },
    { "name": "Webhooks", "description": "Repository event subscriptions with signed, durable HTTPS delivery." },
    { "name": "Branch Protection", "description": "Repository receive-pack safety rules enforced by native Git." },
    { "name": "Moderation" },
    { "name": "Sync", "description": "Optional Electric shape streams over eventually consistent public network projections. Anonymous requests and PATs receive the public shape. A valid adenosine_session cookie applies that account's blocked-DID and hidden-record policy to the server-owned base shape; an invalid presented session is rejected rather than downgraded. Moderated responses are private and must not be shared. Continue with Electric's handle and offset headers, restarting from offset=-1 after moderation preferences change or a must-refetch control message. REST remains the complete read fallback and canonical write API when Electric is unavailable. Clients compose activity from these documented projections; network.records and moderation tables are never exposed." }
  ],
  "paths": {
    "/health/live": {
      "get": {
        "operationId": "getLiveness",
        "tags": ["Health"],
        "summary": "Check process liveness",
        "responses": {
          "200": {
            "description": "The process is alive",
            "headers": { "X-Request-ID": { "$ref": "#/components/headers/RequestID" } },
            "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Health" } } }
          }
        }
      }
    },
    "/health/ready": {
      "get": {
        "operationId": "getReadiness",
        "tags": ["Health"],
        "summary": "Check service readiness",
        "responses": {
          "200": {
            "description": "All required dependencies are ready",
            "headers": { "X-Request-ID": { "$ref": "#/components/headers/RequestID" } },
            "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Health" } } }
          },
          "503": {
            "description": "A required dependency is unavailable",
            "headers": { "X-Request-ID": { "$ref": "#/components/headers/RequestID" } },
            "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Health" } } }
          }
        }
      }
    },
    "/api/v1/me": {
      "get": {
        "operationId": "getCurrentIdentity",
        "tags": ["Identity"],
        "summary": "Get the authenticated identity",
        "security": [{ "sessionCookie": [] }, { "personalAccessToken": [] }],
        "responses": {
          "200": {
            "description": "Current DID-based identity",
            "headers": { "X-Request-ID": { "$ref": "#/components/headers/RequestID" } },
            "content": { "application/json": { "schema": { "$ref": "#/components/schemas/CurrentIdentity" } } }
          },
          "401": { "$ref": "#/components/responses/Unauthorized" }
        }
      }
    },
    "/api/v1/notifications": {
      "get": {
        "operationId": "listNotifications", "tags": ["Notifications"], "summary": "List the authenticated account's notifications",
        "description": "Returns a stable keyset page derived from indexed mentions, issue discussion, pull-request reviews, and merges. Results respect the account's moderation preferences.",
        "security": [{ "sessionCookie": [] }, { "personalAccessToken": [] }],
        "parameters": [{ "$ref": "#/components/parameters/Limit" }, { "$ref": "#/components/parameters/Cursor" }, { "name": "unread", "in": "query", "required": false, "schema": { "type": "boolean", "default": false } }],
        "responses": { "200": { "description": "Notification page", "headers": { "X-Request-ID": { "$ref": "#/components/headers/RequestID" } }, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/NotificationList" } } } }, "400": { "$ref": "#/components/responses/BadRequest" }, "401": { "$ref": "#/components/responses/Unauthorized" } }
      }
    },
    "/api/v1/notifications/{notification}": {
      "patch": {
        "operationId": "updateNotification", "tags": ["Notifications"], "summary": "Update notification read state", "security": [{ "sessionCookie": [] }, { "personalAccessToken": [] }],
        "parameters": [{ "name": "notification", "in": "path", "required": true, "schema": { "type": "string", "format": "uuid" } }],
        "requestBody": { "required": true, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/UpdateNotificationRequest" } } } },
        "responses": { "204": { "description": "Read state updated", "headers": { "X-Request-ID": { "$ref": "#/components/headers/RequestID" } } }, "400": { "$ref": "#/components/responses/BadRequest" }, "401": { "$ref": "#/components/responses/Unauthorized" }, "403": { "$ref": "#/components/responses/Forbidden" } }
      },
      "delete": {
        "operationId": "deleteNotification", "tags": ["Notifications"], "summary": "Dismiss a notification from the inbox", "security": [{ "sessionCookie": [] }, { "personalAccessToken": [] }],
        "parameters": [{ "name": "notification", "in": "path", "required": true, "schema": { "type": "string", "format": "uuid" } }],
        "responses": { "204": { "description": "Notification dismissed", "headers": { "X-Request-ID": { "$ref": "#/components/headers/RequestID" } } }, "401": { "$ref": "#/components/responses/Unauthorized" }, "403": { "$ref": "#/components/responses/Forbidden" } }
      }
    },
    "/api/v1/auth/atproto/start": {
      "post": {
        "operationId": "startATProtoLogin",
        "tags": ["Identity"],
        "summary": "Start AT Protocol OAuth login",
        "requestBody": { "required": true, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/StartATProtoLoginRequest" } } } },
        "responses": {
          "200": { "description": "Authorization URL", "headers": { "X-Request-ID": { "$ref": "#/components/headers/RequestID" } }, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/StartATProtoLoginResponse" } } } },
          "400": { "$ref": "#/components/responses/BadRequest" },
          "422": { "$ref": "#/components/responses/UnprocessableEntity" },
          "502": { "description": "AT Protocol identity or OAuth provider unavailable", "headers": { "X-Request-ID": { "$ref": "#/components/headers/RequestID" } }, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ErrorResponse" } } } }
        }
      }
    },
    "/api/v1/auth/logout": {
      "post": {
        "operationId": "logout",
        "tags": ["Identity"],
        "summary": "Revoke the current local browser session",
        "security": [{ "sessionCookie": [] }],
        "responses": {
          "204": { "description": "Session revoked", "headers": { "X-Request-ID": { "$ref": "#/components/headers/RequestID" } } },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "403": { "$ref": "#/components/responses/Forbidden" },
          "404": { "$ref": "#/components/responses/NotFound" }
        }
      }
    },
    "/oauth/atproto/callback": {
      "get": {
        "operationId": "completeATProtoLogin",
        "tags": ["Identity"],
        "summary": "Complete AT Protocol OAuth login",
        "parameters": [
          { "name": "state", "in": "query", "required": false, "schema": { "type": "string" } },
          { "name": "iss", "in": "query", "required": false, "schema": { "type": "string" } },
          { "name": "code", "in": "query", "required": false, "schema": { "type": "string" } },
          { "name": "error", "in": "query", "required": false, "schema": { "type": "string" } },
          { "name": "error_description", "in": "query", "required": false, "schema": { "type": "string" } },
          { "name": "error_uri", "in": "query", "required": false, "schema": { "type": "string" } }
        ],
        "responses": {
          "303": {
            "description": "Local session created",
            "headers": {
              "Location": { "schema": { "type": "string" } },
              "Set-Cookie": { "schema": { "type": "string" } }
            }
          },
          "400": { "$ref": "#/components/responses/BadRequest" }
        }
      }
    },
    "/oauth/client-metadata.json": {
      "get": {
        "operationId": "getOAuthClientMetadata",
        "tags": ["Identity"],
        "summary": "Get the public AT Protocol OAuth client metadata",
        "responses": {
          "200": { "description": "OAuth client metadata", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/OAuthClientMetadata" } } } }
        }
      }
    },
    "/api/v1/passkeys/registration/options": {
      "post": {
        "operationId": "beginPasskeyRegistration",
        "tags": ["Passkeys"],
        "summary": "Begin passkey registration for the current browser session",
        "security": [{ "sessionCookie": [] }],
        "parameters": [{ "$ref": "#/components/parameters/ExactOrigin" }],
        "requestBody": { "required": true, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/BeginPasskeyRegistrationRequest" } } } },
        "responses": {
          "200": { "description": "WebAuthn registration options", "headers": { "X-Request-ID": { "$ref": "#/components/headers/RequestID" } }, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/PasskeyCeremonyOptions" } } } },
          "400": { "$ref": "#/components/responses/BadRequest" },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "403": { "$ref": "#/components/responses/Forbidden" },
          "409": { "$ref": "#/components/responses/Conflict" },
          "422": { "$ref": "#/components/responses/UnprocessableEntity" }
        }
      }
    },
    "/api/v1/passkeys/registration/verify": {
      "post": {
        "operationId": "verifyPasskeyRegistration",
        "tags": ["Passkeys"],
        "summary": "Verify passkey registration for the current browser session",
        "security": [{ "sessionCookie": [] }],
        "parameters": [{ "$ref": "#/components/parameters/ExactOrigin" }],
        "requestBody": { "required": true, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/VerifyPasskeyCeremonyRequest" } } } },
        "responses": {
          "201": {
            "description": "Passkey registered",
            "headers": { "Location": { "description": "Canonical API URL for the passkey", "schema": { "type": "string", "format": "uri-reference" } }, "X-Request-ID": { "$ref": "#/components/headers/RequestID" } },
            "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Passkey" } } }
          },
          "400": { "$ref": "#/components/responses/BadRequest" },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "403": { "$ref": "#/components/responses/Forbidden" },
          "409": { "$ref": "#/components/responses/Conflict" },
          "422": { "$ref": "#/components/responses/UnprocessableEntity" }
        }
      }
    },
    "/api/v1/passkeys/login/options": {
      "post": {
        "operationId": "beginPasskeyLogin",
        "tags": ["Passkeys"],
        "summary": "Begin anonymous discoverable passkey login",
        "security": [],
        "parameters": [{ "$ref": "#/components/parameters/ExactOrigin" }],
        "responses": {
          "200": { "description": "WebAuthn login options", "headers": { "X-Request-ID": { "$ref": "#/components/headers/RequestID" } }, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/PasskeyCeremonyOptions" } } } },
          "403": { "$ref": "#/components/responses/Forbidden" },
          "409": { "$ref": "#/components/responses/Conflict" }
        }
      }
    },
    "/api/v1/passkeys/login/verify": {
      "post": {
        "operationId": "verifyPasskeyLogin",
        "tags": ["Passkeys"],
        "summary": "Verify anonymous discoverable passkey login",
        "security": [],
        "parameters": [{ "$ref": "#/components/parameters/ExactOrigin" }],
        "requestBody": { "required": true, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/VerifyPasskeyCeremonyRequest" } } } },
        "responses": {
          "204": { "description": "Local browser session created", "headers": { "Set-Cookie": { "schema": { "type": "string" } }, "X-Request-ID": { "$ref": "#/components/headers/RequestID" } } },
          "400": { "$ref": "#/components/responses/BadRequest" },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "403": { "$ref": "#/components/responses/Forbidden" }
        }
      }
    },
    "/api/v1/passkeys": {
      "get": {
        "operationId": "listPasskeys",
        "tags": ["Passkeys"],
        "summary": "List passkey metadata for the current browser session",
        "security": [{ "sessionCookie": [] }],
        "parameters": [{ "$ref": "#/components/parameters/Limit" }, { "$ref": "#/components/parameters/Cursor" }],
        "responses": {
          "200": { "description": "Active passkey metadata", "headers": { "X-Request-ID": { "$ref": "#/components/headers/RequestID" } }, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/PasskeyList" } } } },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "403": { "$ref": "#/components/responses/Forbidden" }
        }
      }
    },
    "/api/v1/passkeys/{id}": {
      "delete": {
        "operationId": "deletePasskey",
        "tags": ["Passkeys"],
        "summary": "Revoke a passkey owned by the current browser session",
        "security": [{ "sessionCookie": [] }],
        "parameters": [
          { "name": "id", "in": "path", "required": true, "schema": { "type": "string", "format": "uuid" } },
          { "$ref": "#/components/parameters/ExactOrigin" }
        ],
        "responses": {
          "204": { "description": "Passkey revoked", "headers": { "X-Request-ID": { "$ref": "#/components/headers/RequestID" } } },
          "400": { "$ref": "#/components/responses/BadRequest" },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "403": { "$ref": "#/components/responses/Forbidden" },
          "404": { "$ref": "#/components/responses/NotFound" }
        }
      }
    },
    "/api/v1/owners/{owner}": {
      "get": {
        "operationId": "getOwner",
        "tags": ["Owners"],
        "summary": "Resolve a public owner name",
        "description": "Returns the account or organization that owns a case-insensitive public name. Use this resource to route /{owner}; do not probe the profile and organization endpoints. Local names are authoritative, while active federated account handles are a read-only fallback.",
        "security": [],
        "parameters": [{ "$ref": "#/components/parameters/OwnerNamePath" }],
        "responses": {
          "200": { "description": "Resolved owner", "headers": { "X-Request-ID": { "$ref": "#/components/headers/RequestID" } }, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Owner" } } } },
          "404": { "$ref": "#/components/responses/NotFound" }
        }
      }
    },
    "/api/v1/profiles/{did}": {
      "get": {
        "operationId": "getDeveloperProfile",
        "tags": ["Profiles"],
        "summary": "Get a shared developer profile",
        "security": [{}, { "sessionCookie": [] }],
        "parameters": [
          { "name": "did", "in": "path", "required": true, "schema": { "type": "string", "minLength": 1 } }
        ],
        "responses": {
          "200": {
            "description": "Shared developer profile",
            "headers": { "X-Request-ID": { "$ref": "#/components/headers/RequestID" } },
            "content": { "application/json": { "schema": { "$ref": "#/components/schemas/DeveloperProfile" } } }
          },
          "404": { "$ref": "#/components/responses/NotFound" },
          "422": { "$ref": "#/components/responses/UnprocessableEntity" },
          "502": { "description": "The profile provider is unavailable", "headers": { "X-Request-ID": { "$ref": "#/components/headers/RequestID" } }, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ErrorResponse" } } } }
        }
      }
    },
    "/api/v1/profile": {
      "put": {
        "operationId": "updateDeveloperProfile",
        "tags": ["Profiles"],
        "summary": "Replace the authenticated developer's shared profile",
        "security": [{ "sessionCookie": [] }],
        "requestBody": {
          "required": true,
          "content": { "application/json": { "schema": { "$ref": "#/components/schemas/UpdateDeveloperProfileRequest" } } }
        },
        "responses": {
          "200": { "description": "Updated shared developer profile", "headers": { "X-Request-ID": { "$ref": "#/components/headers/RequestID" } }, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/DeveloperProfile" } } } },
          "400": { "$ref": "#/components/responses/BadRequest" },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "403": { "$ref": "#/components/responses/Forbidden" },
          "422": { "$ref": "#/components/responses/UnprocessableEntity" },
          "502": { "description": "The profile provider is unavailable", "headers": { "X-Request-ID": { "$ref": "#/components/headers/RequestID" } }, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ErrorResponse" } } } }
        }
      }
    },
    "/api/v1/organizations": {
      "get": {
        "operationId": "listOrganizations",
        "tags": ["Organizations"],
        "summary": "List organizations for the authenticated user",
        "security": [{ "sessionCookie": [] }],
        "parameters": [{ "$ref": "#/components/parameters/Limit" }, { "$ref": "#/components/parameters/Cursor" }],
        "responses": {
          "200": { "description": "Organization memberships", "headers": { "X-Request-ID": { "$ref": "#/components/headers/RequestID" } }, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/OrganizationList" } } } },
          "401": { "$ref": "#/components/responses/Unauthorized" }
        }
      },
      "post": {
        "operationId": "createOrganization",
        "tags": ["Organizations"],
        "summary": "Create an organization with the authenticated user as its first owner",
        "security": [{ "sessionCookie": [] }],
        "requestBody": { "required": true, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/CreateOrganizationRequest" } } } },
        "responses": {
          "201": { "description": "Organization created and published", "headers": { "Location": { "schema": { "type": "string" } }, "X-Request-ID": { "$ref": "#/components/headers/RequestID" } }, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Organization" } } } },
          "400": { "$ref": "#/components/responses/BadRequest" }, "401": { "$ref": "#/components/responses/Unauthorized" }, "403": { "$ref": "#/components/responses/Forbidden" }, "409": { "$ref": "#/components/responses/Conflict" }, "422": { "$ref": "#/components/responses/UnprocessableEntity" },
          "502": { "description": "AT Protocol provider unavailable", "headers": { "X-Request-ID": { "$ref": "#/components/headers/RequestID" } }, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ErrorResponse" } } } }
        }
      }
    },
    "/api/v1/organization-invitations": {
      "get": {
        "operationId": "listOrganizationInvitationsForCurrentUser",
        "tags": ["Organizations"],
        "summary": "List active organization invitations for the authenticated user",
        "security": [{ "sessionCookie": [] }],
        "parameters": [{ "$ref": "#/components/parameters/Limit" }, { "$ref": "#/components/parameters/Cursor" }],
        "responses": { "200": { "description": "Pending invitations", "headers": { "X-Request-ID": { "$ref": "#/components/headers/RequestID" } }, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/OrganizationInvitationList" } } } }, "401": { "$ref": "#/components/responses/Unauthorized" } }
      }
    },
    "/api/v1/organization-invitations/{invitation}/accept": {
      "post": {
        "operationId": "acceptOrganizationInvitation",
        "tags": ["Organizations"],
        "summary": "Accept an organization invitation",
        "security": [{ "sessionCookie": [] }],
        "parameters": [{ "name": "invitation", "in": "path", "required": true, "schema": { "type": "string", "format": "uuid" } }],
        "responses": {
          "200": { "description": "Membership activated", "headers": { "X-Request-ID": { "$ref": "#/components/headers/RequestID" } }, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/OrganizationMember" } } } },
          "401": { "$ref": "#/components/responses/Unauthorized" }, "403": { "$ref": "#/components/responses/Forbidden" }, "404": { "$ref": "#/components/responses/NotFound" }, "409": { "$ref": "#/components/responses/Conflict" },
          "502": { "description": "AT Protocol provider unavailable", "headers": { "X-Request-ID": { "$ref": "#/components/headers/RequestID" } }, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ErrorResponse" } } } }
        }
      }
    },
    "/api/v1/organizations/{organization}": {
      "get": {
        "operationId": "getOrganization",
        "tags": ["Organizations"],
        "summary": "Get an organization profile",
        "parameters": [{ "$ref": "#/components/parameters/OrganizationSlug" }],
          "responses": { "200": { "description": "Organization profile", "headers": { "X-Request-ID": { "$ref": "#/components/headers/RequestID" } }, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Organization" } } } }, "404": { "$ref": "#/components/responses/NotFound" } }
      },
      "patch": {
        "operationId": "updateOrganization", "tags": ["Organizations"], "summary": "Update organization profile and repository policy", "security": [{ "sessionCookie": [] }],
        "parameters": [{ "$ref": "#/components/parameters/OrganizationSlug" }],
        "requestBody": { "required": true, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/UpdateOrganizationRequest" } } } },
        "responses": { "200": { "description": "Organization updated and republished", "headers": { "X-Request-ID": { "$ref": "#/components/headers/RequestID" } }, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Organization" } } } }, "400": { "$ref": "#/components/responses/BadRequest" }, "401": { "$ref": "#/components/responses/Unauthorized" }, "403": { "$ref": "#/components/responses/Forbidden" }, "404": { "$ref": "#/components/responses/NotFound" }, "422": { "$ref": "#/components/responses/UnprocessableEntity" }, "502": { "description": "AT Protocol provider unavailable", "headers": { "X-Request-ID": { "$ref": "#/components/headers/RequestID" } }, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ErrorResponse" } } } } }
      }
    },
    "/api/v1/organizations/{organization}/invitations": {
      "get": {
        "operationId": "listOrganizationInvitations", "tags": ["Organizations"], "summary": "List active invitations for organization owners", "security": [{ "sessionCookie": [] }],
        "parameters": [{ "$ref": "#/components/parameters/OrganizationSlug" }, { "$ref": "#/components/parameters/Limit" }, { "$ref": "#/components/parameters/Cursor" }],
        "responses": { "200": { "description": "Active organization invitations", "headers": { "X-Request-ID": { "$ref": "#/components/headers/RequestID" } }, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/OrganizationInvitationList" } } } }, "401": { "$ref": "#/components/responses/Unauthorized" }, "403": { "$ref": "#/components/responses/Forbidden" }, "404": { "$ref": "#/components/responses/NotFound" } }
      }
    },
    "/api/v1/organizations/{organization}/invitations/{invitation}": {
      "delete": {
        "operationId": "revokeOrganizationInvitation", "tags": ["Organizations"], "summary": "Revoke a pending organization invitation", "security": [{ "sessionCookie": [] }],
        "parameters": [{ "$ref": "#/components/parameters/OrganizationSlug" }, { "name": "invitation", "in": "path", "required": true, "schema": { "type": "string", "format": "uuid" } }],
        "responses": { "204": { "description": "Invitation revoked", "headers": { "X-Request-ID": { "$ref": "#/components/headers/RequestID" } } }, "401": { "$ref": "#/components/responses/Unauthorized" }, "403": { "$ref": "#/components/responses/Forbidden" }, "404": { "$ref": "#/components/responses/NotFound" }, "409": { "$ref": "#/components/responses/Conflict" }, "502": { "description": "AT Protocol provider unavailable", "headers": { "X-Request-ID": { "$ref": "#/components/headers/RequestID" } }, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ErrorResponse" } } } } }
      }
    },
    "/api/v1/organizations/{organization}/audit-log": {
      "get": {
