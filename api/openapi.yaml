      "UnprocessableEntity": { "description": "The request is structurally valid but semantically invalid", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ErrorResponse" } } } },
      "ElectricShape": {
        "description": "Electric shape-log or subset-snapshot response over an eventually consistent projection. Protocol headers such as electric-handle, electric-offset, electric-cursor, electric-schema, cache-control, and etag are preserved. Responses selected by a valid browser session are private and no-store; anonymous and PAT requests use the public shape. REST remains available if sync is disabled or unavailable.",
        "headers": {
          "electric-handle": { "schema": { "type": "string" } },
          "electric-offset": { "schema": { "type": "string" } },
          "electric-cursor": { "schema": { "type": "string" } },
          "electric-schema": { "schema": { "type": "string" } },
          "etag": { "schema": { "type": "string" } },
          "cache-control": { "schema": { "type": "string" } },
          "Vary": { "description": "Always includes Cookie and Authorization.", "schema": { "type": "string" } }
        },
        "content": { "application/json": { "schema": { "oneOf": [
          { "type": "array", "items": { "$ref": "#/components/schemas/ElectricShapeMessage" } },
          { "$ref": "#/components/schemas/ElectricSubsetResponse" }
        ] } }, "text/event-stream": { "schema": { "type": "string" } } }
      },
