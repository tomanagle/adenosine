    "/api/v1/sync/repositories": {
      "get": {
        "operationId": "getSyncRepositories",
        "tags": ["Sync"],
        "summary": "Synchronize the public repository projection",
        "description": "Proxies an Electric 1.7.10 shape fixed to approved columns from network.repositories. Adenosine always applies deleted_at IS NULL AND cid IS NOT NULL plus optional server-owned browser-session moderation. The response is an Electric shape log: regular requests return an array of operation/control messages, not REST Repository objects. Insert values correspond to SyncRepository; update and delete values may contain only changed or key columns according to Electric replica semantics.",
        "security": [],
        "parameters": [
          { "$ref": "#/components/parameters/ElectricOffset" },
          { "$ref": "#/components/parameters/ElectricHandle" },
          { "$ref": "#/components/parameters/ElectricCursor" },
          { "$ref": "#/components/parameters/ElectricCacheBuster" },
          { "$ref": "#/components/parameters/ElectricExpiredHandle" },
          { "$ref": "#/components/parameters/ElectricLive" },
          { "$ref": "#/components/parameters/ElectricLiveSSE" },
          { "$ref": "#/components/parameters/ElectricReplica" },
          { "$ref": "#/components/parameters/ElectricLog" }
        ],
        "responses": {
          "200": { "$ref": "#/components/responses/ElectricShape" },
          "304": { "description": "The cached shape response is still current", "headers": { "X-Request-ID": { "$ref": "#/components/headers/RequestID" } } },
          "400": { "$ref": "#/components/responses/BadRequest" },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "409": { "$ref": "#/components/responses/ElectricShapeConflict" },
          "429": { "description": "Electric is temporarily busy", "headers": { "X-Request-ID": { "$ref": "#/components/headers/RequestID" } }, "content": { "application/json": { "schema": { "type": "object", "additionalProperties": true } } } },
          "502": { "description": "Electric is unavailable", "headers": { "X-Request-ID": { "$ref": "#/components/headers/RequestID" } }, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ErrorResponse" } } } },
          "503": { "description": "Realtime sync is not configured", "headers": { "X-Request-ID": { "$ref": "#/components/headers/RequestID" } }, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ErrorResponse" } } } }
        }
      },
      "post": {
        "operationId": "postSyncRepositories",
        "tags": ["Sync"],
        "summary": "Synchronize or request a subset of the public repository projection",
        "description": "Uses Electric 1.7.10 POST subset semantics. The optional JSON body can only narrow the server-owned shape. Electric combines body where with Adenosine's main predicate using AND and restricts filtering and ordering to the server-owned queryable column list. An empty body is forwarded as Electric's supported empty POST form.",
        "security": [],
        "parameters": [
          { "$ref": "#/components/parameters/ElectricOffset" },
          { "$ref": "#/components/parameters/ElectricHandle" },
          { "$ref": "#/components/parameters/ElectricCacheBuster" },
          { "$ref": "#/components/parameters/ElectricExpiredHandle" },
          { "$ref": "#/components/parameters/ElectricReplica" },
          { "$ref": "#/components/parameters/ElectricLog" }
        ],
        "requestBody": { "required": false, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/SyncSubsetRequest" } } } },
        "responses": {
          "200": { "$ref": "#/components/responses/ElectricShape" },
          "400": { "$ref": "#/components/responses/BadRequest" },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "409": { "$ref": "#/components/responses/ElectricShapeConflict" },
