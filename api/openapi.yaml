      "BadRequest": { "description": "Malformed request", "headers": { "X-Request-ID": { "$ref": "#/components/headers/RequestID" } }, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ErrorResponse" } } } },
      "Unauthorized": { "description": "Authentication required", "headers": { "X-Request-ID": { "$ref": "#/components/headers/RequestID" } }, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ErrorResponse" } } } },
      "Forbidden": { "description": "The identity is not authorized", "headers": { "X-Request-ID": { "$ref": "#/components/headers/RequestID" } }, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ErrorResponse" } } } },
      "NotFound": { "description": "The requested resource was not found", "headers": { "X-Request-ID": { "$ref": "#/components/headers/RequestID" } }, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ErrorResponse" } } } },
      "Conflict": { "description": "The request conflicts with existing state", "headers": { "X-Request-ID": { "$ref": "#/components/headers/RequestID" } }, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ErrorResponse" } } } },
      "UnprocessableEntity": { "description": "The request is structurally valid but semantically invalid", "headers": { "X-Request-ID": { "$ref": "#/components/headers/RequestID" } }, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ErrorResponse" } } } },
      "BadGateway": { "description": "The canonical upstream or publication provider is unavailable", "headers": { "X-Request-ID": { "$ref": "#/components/headers/RequestID" } }, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ErrorResponse" } } } },
      "ElectricShape": {
        "description": "Electric shape-log or subset-snapshot response over an eventually consistent projection. Protocol headers such as electric-handle, electric-offset, electric-cursor, electric-schema, cache-control, and etag are preserved. Responses selected by a valid browser session are private and no-store; anonymous and PAT requests use the public shape. REST remains available if sync is disabled or unavailable.",
        "headers": {
          "X-Request-ID": { "$ref": "#/components/headers/RequestID" },
          "electric-handle": { "schema": { "type": "string" } },
          "electric-offset": { "schema": { "type": "string" } },
          "electric-cursor": { "schema": { "type": "string" } },
          "electric-schema": { "schema": { "type": "string" } },
          "etag": { "schema": { "type": "string" } },
          "cache-control": { "schema": { "type": "string" } },
          "Vary": { "description": "Always includes Cookie and Authorization.", "schema": { "type": "string" } }
        },
        "content": { "application/json": { "schema": { "oneOf": [
          { "type": "array", "items": { "$ref": "#/components/schemas/ElectricShapeMessage" } },
          { "$ref": "#/components/schemas/ElectricSubsetResponse" }
        ] } }, "text/event-stream": { "schema": { "type": "string" } } }
      },
      "ElectricShapeConflict": {
        "description": "The requested offset no longer exists. The body contains Electric's must-refetch control message and electric-handle may identify the replacement shape.",
