{
  "openapi": "3.0.3",
  "info": {
    "title": "Adenosine API",
    "version": "0.1.0",
    "description": "The stable public contract for Adenosine clients. REST is the canonical write path and remains fully functional without realtime sync."
  },
  "servers": [{ "url": "/" }],
  "tags": [
    { "name": "Health" },
    { "name": "Identity" },
    { "name": "Profiles" },
    { "name": "Repositories" },
    { "name": "Credentials" },
    { "name": "Passkeys" },
    { "name": "Issues" },
    { "name": "Pull Requests" },
    { "name": "Comments" },
    { "name": "Moderation" },
    { "name": "Sync", "description": "Optional Electric shape streams over eventually consistent public network projections. Anonymous requests and PATs receive the public shape. A valid adenosine_session cookie applies that account's blocked-DID and hidden-record policy to the server-owned base shape; an invalid presented session is rejected rather than downgraded. Moderated responses are private and must not be shared. Continue with Electric's handle and offset headers, restarting from offset=-1 after moderation preferences change or a must-refetch control message. REST remains the complete read fallback and canonical write API when Electric is unavailable. Clients compose activity from these documented projections; network.records and moderation tables are never exposed." }
  ],
  "paths": {
    "/health/live": {
      "get": {
        "operationId": "getLiveness",
        "tags": ["Health"],
        "summary": "Check process liveness",
        "responses": {
          "200": {
            "description": "The process is alive",
            "headers": { "X-Request-ID": { "$ref": "#/components/headers/RequestID" } },
            "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Health" } } }
          }
        }
      }
    },
    "/health/ready": {
      "get": {
        "operationId": "getReadiness",
        "tags": ["Health"],
        "summary": "Check service readiness",
        "responses": {
          "200": {
            "description": "All required dependencies are ready",
            "headers": { "X-Request-ID": { "$ref": "#/components/headers/RequestID" } },
            "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Health" } } }
          },
          "503": {
            "description": "A required dependency is unavailable",
            "headers": { "X-Request-ID": { "$ref": "#/components/headers/RequestID" } },
            "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Health" } } }
          }
        }
      }
    },
    "/api/v1/me": {
      "get": {
        "operationId": "getCurrentIdentity",
        "tags": ["Identity"],
        "summary": "Get the authenticated identity",
        "security": [{ "sessionCookie": [] }, { "personalAccessToken": [] }],
        "responses": {
          "200": {
            "description": "Current DID-based identity",
            "headers": { "X-Request-ID": { "$ref": "#/components/headers/RequestID" } },
            "content": { "application/json": { "schema": { "$ref": "#/components/schemas/CurrentIdentity" } } }
          },
          "401": { "$ref": "#/components/responses/Unauthorized" }
        }
      }
    },
    "/api/v1/auth/atproto/start": {
      "post": {
        "operationId": "startATProtoLogin",
        "tags": ["Identity"],
        "summary": "Start AT Protocol OAuth login",
        "requestBody": { "required": true, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/StartATProtoLoginRequest" } } } },
        "responses": {
          "200": { "description": "Authorization URL", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/StartATProtoLoginResponse" } } } },
          "400": { "$ref": "#/components/responses/BadRequest" },
          "422": { "$ref": "#/components/responses/UnprocessableEntity" },
          "502": { "description": "AT Protocol identity or OAuth provider unavailable", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ErrorResponse" } } } }
        }
      }
    },
    "/api/v1/auth/logout": {
      "post": {
        "operationId": "logout",
        "tags": ["Identity"],
        "summary": "Revoke the current local browser session",
        "security": [{ "sessionCookie": [] }],
        "responses": {
          "204": { "description": "Session revoked" },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "403": { "$ref": "#/components/responses/Forbidden" },
          "404": { "$ref": "#/components/responses/NotFound" }
        }
      }
    },
    "/oauth/atproto/callback": {
      "get": {
        "operationId": "completeATProtoLogin",
        "tags": ["Identity"],
        "summary": "Complete AT Protocol OAuth login",
        "parameters": [
          { "name": "state", "in": "query", "required": false, "schema": { "type": "string" } },
          { "name": "iss", "in": "query", "required": false, "schema": { "type": "string" } },
          { "name": "code", "in": "query", "required": false, "schema": { "type": "string" } },
          { "name": "error", "in": "query", "required": false, "schema": { "type": "string" } },
          { "name": "error_description", "in": "query", "required": false, "schema": { "type": "string" } },
          { "name": "error_uri", "in": "query", "required": false, "schema": { "type": "string" } }
        ],
        "responses": {
          "303": {
            "description": "Local session created",
            "headers": {
              "Location": { "schema": { "type": "string" } },
              "Set-Cookie": { "schema": { "type": "string" } }
            }
          },
          "400": { "$ref": "#/components/responses/BadRequest" }
        }
      }
    },
    "/oauth/client-metadata.json": {
      "get": {
        "operationId": "getOAuthClientMetadata",
        "tags": ["Identity"],
        "summary": "Get the public AT Protocol OAuth client metadata",
        "responses": {
          "200": { "description": "OAuth client metadata", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/OAuthClientMetadata" } } } }
        }
      }
    },
    "/api/v1/passkeys/registration/options": {
      "post": {
        "operationId": "beginPasskeyRegistration",
        "tags": ["Passkeys"],
        "summary": "Begin passkey registration for the current browser session",
        "security": [{ "sessionCookie": [] }],
        "parameters": [{ "$ref": "#/components/parameters/ExactOrigin" }],
        "requestBody": { "required": true, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/BeginPasskeyRegistrationRequest" } } } },
        "responses": {
          "200": { "description": "WebAuthn registration options", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/PasskeyCeremonyOptions" } } } },
          "400": { "$ref": "#/components/responses/BadRequest" },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "403": { "$ref": "#/components/responses/Forbidden" },
          "409": { "$ref": "#/components/responses/Conflict" },
          "422": { "$ref": "#/components/responses/UnprocessableEntity" }
        }
      }
    },
    "/api/v1/passkeys/registration/verify": {
      "post": {
        "operationId": "verifyPasskeyRegistration",
        "tags": ["Passkeys"],
        "summary": "Verify passkey registration for the current browser session",
        "security": [{ "sessionCookie": [] }],
        "parameters": [{ "$ref": "#/components/parameters/ExactOrigin" }],
        "requestBody": { "required": true, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/VerifyPasskeyCeremonyRequest" } } } },
        "responses": {
          "201": {
            "description": "Passkey registered",
            "headers": { "Location": { "description": "Canonical API URL for the passkey", "schema": { "type": "string", "format": "uri-reference" } } },
            "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Passkey" } } }
          },
          "400": { "$ref": "#/components/responses/BadRequest" },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "403": { "$ref": "#/components/responses/Forbidden" },
          "409": { "$ref": "#/components/responses/Conflict" },
          "422": { "$ref": "#/components/responses/UnprocessableEntity" }
        }
      }
    },
    "/api/v1/passkeys/login/options": {
      "post": {
        "operationId": "beginPasskeyLogin",
        "tags": ["Passkeys"],
        "summary": "Begin anonymous discoverable passkey login",
        "security": [],
        "parameters": [{ "$ref": "#/components/parameters/ExactOrigin" }],
        "responses": {
          "200": { "description": "WebAuthn login options", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/PasskeyCeremonyOptions" } } } },
          "403": { "$ref": "#/components/responses/Forbidden" },
          "409": { "$ref": "#/components/responses/Conflict" }
        }
      }
    },
    "/api/v1/passkeys/login/verify": {
      "post": {
        "operationId": "verifyPasskeyLogin",
        "tags": ["Passkeys"],
        "summary": "Verify anonymous discoverable passkey login",
        "security": [],
        "parameters": [{ "$ref": "#/components/parameters/ExactOrigin" }],
        "requestBody": { "required": true, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/VerifyPasskeyCeremonyRequest" } } } },
        "responses": {
          "204": { "description": "Local browser session created", "headers": { "Set-Cookie": { "schema": { "type": "string" } } } },
          "400": { "$ref": "#/components/responses/BadRequest" },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "403": { "$ref": "#/components/responses/Forbidden" }
        }
      }
    },
    "/api/v1/passkeys": {
      "get": {
        "operationId": "listPasskeys",
        "tags": ["Passkeys"],
        "summary": "List passkey metadata for the current browser session",
        "security": [{ "sessionCookie": [] }],
        "responses": {
          "200": { "description": "Active passkey metadata", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/PasskeyList" } } } },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "403": { "$ref": "#/components/responses/Forbidden" }
        }
      }
    },
    "/api/v1/passkeys/{id}": {
      "delete": {
        "operationId": "deletePasskey",
        "tags": ["Passkeys"],
        "summary": "Revoke a passkey owned by the current browser session",
        "security": [{ "sessionCookie": [] }],
        "parameters": [
          { "name": "id", "in": "path", "required": true, "schema": { "type": "string", "format": "uuid" } },
          { "$ref": "#/components/parameters/ExactOrigin" }
        ],
        "responses": {
          "204": { "description": "Passkey revoked" },
          "400": { "$ref": "#/components/responses/BadRequest" },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "403": { "$ref": "#/components/responses/Forbidden" },
          "404": { "$ref": "#/components/responses/NotFound" }
        }
      }
    },
    "/api/v1/profiles/{did}": {
      "get": {
        "operationId": "getDeveloperProfile",
        "tags": ["Profiles"],
        "summary": "Get a shared developer profile",
        "parameters": [
          { "name": "did", "in": "path", "required": true, "schema": { "type": "string", "minLength": 1 } }
        ],
        "responses": {
          "200": {
            "description": "Shared developer profile",
            "headers": { "X-Request-ID": { "$ref": "#/components/headers/RequestID" } },
            "content": { "application/json": { "schema": { "$ref": "#/components/schemas/DeveloperProfile" } } }
          },
          "404": { "$ref": "#/components/responses/NotFound" },
          "422": { "$ref": "#/components/responses/UnprocessableEntity" },
          "502": { "description": "The profile provider is unavailable", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ErrorResponse" } } } }
        }
      }
    },
    "/api/v1/profile": {
      "put": {
        "operationId": "updateDeveloperProfile",
        "tags": ["Profiles"],
        "summary": "Replace the authenticated developer's shared profile",
        "security": [{ "sessionCookie": [] }],
        "requestBody": {
          "required": true,
          "content": { "application/json": { "schema": { "$ref": "#/components/schemas/UpdateDeveloperProfileRequest" } } }
        },
        "responses": {
          "200": { "description": "Updated shared developer profile", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/DeveloperProfile" } } } },
          "400": { "$ref": "#/components/responses/BadRequest" },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "403": { "$ref": "#/components/responses/Forbidden" },
          "422": { "$ref": "#/components/responses/UnprocessableEntity" },
          "502": { "description": "The profile provider is unavailable", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ErrorResponse" } } } }
        }
      }
    },
    "/api/v1/repositories": {
      "post": {
        "operationId": "createRepository",
        "tags": ["Repositories"],
        "summary": "Create a locally hosted repository",
        "security": [{ "sessionCookie": [] }, { "personalAccessToken": [] }],
        "parameters": [{ "$ref": "#/components/parameters/IdempotencyKey" }],
        "requestBody": {
          "required": true,
          "content": { "application/json": { "schema": { "$ref": "#/components/schemas/CreateRepositoryRequest" } } }
        },
        "responses": {
          "201": {
            "description": "Repository created",
            "headers": {
              "Location": { "description": "Canonical API URL for the repository", "schema": { "type": "string", "format": "uri-reference" } },
              "X-Request-ID": { "$ref": "#/components/headers/RequestID" }
            },
            "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Repository" } } }
          },
          "400": { "$ref": "#/components/responses/BadRequest" },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "403": { "$ref": "#/components/responses/Forbidden" },
          "409": { "$ref": "#/components/responses/Conflict" },
          "422": { "$ref": "#/components/responses/UnprocessableEntity" }
        }
      }
    },
    "/api/v1/stars": {
      "get": {
        "operationId": "getStars", "tags": ["Stars"], "summary": "Get projected stars for a repository", "security": [],
        "parameters": [{ "$ref": "#/components/parameters/RepositoryURI" }],
        "responses": {
          "200": { "description": "Current bounded star projection", "headers": { "X-Request-ID": { "$ref": "#/components/headers/RequestID" } }, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/StarList" } } } },
          "404": { "$ref": "#/components/responses/NotFound" }, "422": { "$ref": "#/components/responses/UnprocessableEntity" }
        }
      },
      "put": {
        "operationId": "putStar", "tags": ["Stars"], "summary": "Publish the current developer's star", "security": [{ "sessionCookie": [] }],
        "parameters": [{ "$ref": "#/components/parameters/RepositoryURI" }, { "$ref": "#/components/parameters/MutationOrigin" }],
        "responses": {
          "202": { "description": "Star published; projection update is pending", "headers": { "X-Request-ID": { "$ref": "#/components/headers/RequestID" } }, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/StarMutation" } } } },
          "401": { "$ref": "#/components/responses/Unauthorized" }, "403": { "$ref": "#/components/responses/Forbidden" }, "404": { "$ref": "#/components/responses/NotFound" },
          "409": { "$ref": "#/components/responses/Conflict" }, "422": { "$ref": "#/components/responses/UnprocessableEntity" },
          "502": { "description": "The AT Protocol star provider is unavailable", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ErrorResponse" } } } }
        }
      },
      "delete": {
        "operationId": "deleteStar", "tags": ["Stars"], "summary": "Delete the current developer's star", "security": [{ "sessionCookie": [] }],
        "parameters": [{ "$ref": "#/components/parameters/RepositoryURI" }, { "$ref": "#/components/parameters/MutationOrigin" }],
        "responses": {
          "202": { "description": "Star deleted; projection update is pending", "headers": { "X-Request-ID": { "$ref": "#/components/headers/RequestID" } } },
          "401": { "$ref": "#/components/responses/Unauthorized" }, "403": { "$ref": "#/components/responses/Forbidden" }, "404": { "$ref": "#/components/responses/NotFound" },
          "409": { "$ref": "#/components/responses/Conflict" }, "422": { "$ref": "#/components/responses/UnprocessableEntity" },
          "502": { "description": "The AT Protocol star provider is unavailable", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ErrorResponse" } } } }
        }
      }
    },
    "/api/v1/issues": {
      "get": {
        "operationId": "getIssues", "tags": ["Issues"], "summary": "Get projected issues for a repository", "security": [],
        "parameters": [{ "$ref": "#/components/parameters/RepositoryURI" }],
        "responses": {
          "200": { "description": "Current bounded issue projection", "headers": { "X-Request-ID": { "$ref": "#/components/headers/RequestID" } }, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/IssueList" } } } },
          "404": { "$ref": "#/components/responses/NotFound" }, "422": { "$ref": "#/components/responses/UnprocessableEntity" }
        }
      },
      "post": {
        "operationId": "createIssue", "tags": ["Issues"], "summary": "Publish a reporter-authored issue", "security": [{ "sessionCookie": [] }],
        "parameters": [{ "$ref": "#/components/parameters/ExactOrigin" }],
        "requestBody": { "required": true, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/CreateIssueRequest" } } } },
        "responses": {
          "202": { "description": "Issue published; projection update is pending", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/IssueMutation" } } } },
          "400": { "$ref": "#/components/responses/BadRequest" }, "401": { "$ref": "#/components/responses/Unauthorized" }, "403": { "$ref": "#/components/responses/Forbidden" },
          "404": { "$ref": "#/components/responses/NotFound" }, "409": { "$ref": "#/components/responses/Conflict" }, "422": { "$ref": "#/components/responses/UnprocessableEntity" },
          "502": { "description": "The AT Protocol issue provider is unavailable", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ErrorResponse" } } } }
        }
      },
      "put": {
        "operationId": "putIssueStatus", "tags": ["Issues"], "summary": "Publish repository-authoritative issue state", "security": [{ "sessionCookie": [] }],
        "parameters": [{ "$ref": "#/components/parameters/ExactOrigin" }],
        "requestBody": { "required": true, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/PutIssueStatusRequest" } } } },
        "responses": {
          "202": { "description": "Issue status published; projection update is pending", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/IssueStatusMutation" } } } },
          "400": { "$ref": "#/components/responses/BadRequest" }, "401": { "$ref": "#/components/responses/Unauthorized" }, "403": { "$ref": "#/components/responses/Forbidden" },
          "404": { "$ref": "#/components/responses/NotFound" }, "409": { "$ref": "#/components/responses/Conflict" }, "422": { "$ref": "#/components/responses/UnprocessableEntity" },
          "502": { "description": "The AT Protocol issue provider is unavailable", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ErrorResponse" } } } }
        }
      }
    },
    "/api/v1/issues/comments": {
      "get": {
        "operationId": "getIssueComments", "tags": ["Comments"], "summary": "Get projected comments for an issue", "security": [{}, { "sessionCookie": [] }, { "personalAccessToken": [] }],
        "parameters": [{ "$ref": "#/components/parameters/IssueURI" }],
        "responses": {
          "200": { "description": "Current bounded comment projection, personalized for a valid browser session", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/CommentList" } } } },
          "400": { "$ref": "#/components/responses/BadRequest" }, "401": { "$ref": "#/components/responses/Unauthorized" },
          "404": { "$ref": "#/components/responses/NotFound" }, "422": { "$ref": "#/components/responses/UnprocessableEntity" }
        }
      },
      "post": {
        "operationId": "createIssueComment", "tags": ["Comments"], "summary": "Publish an author-owned issue comment", "security": [{ "sessionCookie": [] }],
        "parameters": [{ "$ref": "#/components/parameters/ExactOrigin" }],
        "requestBody": { "required": true, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/CreateCommentRequest" } } } },
        "responses": {
          "202": { "description": "Comment published; projection update is pending", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/CommentMutation" } } } },
          "400": { "$ref": "#/components/responses/BadRequest" }, "401": { "$ref": "#/components/responses/Unauthorized" }, "403": { "$ref": "#/components/responses/Forbidden" },
          "404": { "$ref": "#/components/responses/NotFound" }, "409": { "$ref": "#/components/responses/Conflict" }, "422": { "$ref": "#/components/responses/UnprocessableEntity" },
          "502": { "description": "The AT Protocol comment provider is unavailable", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ErrorResponse" } } } }
        }
      },
      "delete": {
        "operationId": "deleteIssueComment", "tags": ["Comments"], "summary": "Delete the current developer's issue comment", "security": [{ "sessionCookie": [] }],
        "parameters": [{ "$ref": "#/components/parameters/CommentURI" }, { "$ref": "#/components/parameters/ExactOrigin" }],
        "responses": {
          "202": { "description": "Comment deleted; projection update is pending" },
          "401": { "$ref": "#/components/responses/Unauthorized" }, "403": { "$ref": "#/components/responses/Forbidden" }, "404": { "$ref": "#/components/responses/NotFound" },
          "409": { "$ref": "#/components/responses/Conflict" }, "422": { "$ref": "#/components/responses/UnprocessableEntity" },
          "502": { "description": "The AT Protocol comment provider is unavailable", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ErrorResponse" } } } }
        }
      }
    },
    "/api/v1/pull-requests": {
      "get": {
        "operationId": "listPullRequests", "tags": ["Pull Requests"], "summary": "List projected pull requests targeting a repository", "security": [],
        "parameters": [{ "$ref": "#/components/parameters/RepositoryURI" }],
        "responses": {
          "200": { "description": "Current bounded pull request projection", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/PullRequestList" } } } },
          "404": { "$ref": "#/components/responses/NotFound" }, "422": { "$ref": "#/components/responses/UnprocessableEntity" }
        }
      },
      "post": {
        "operationId": "createPullRequest", "tags": ["Pull Requests"], "summary": "Publish a contributor-authored pull request", "security": [{ "sessionCookie": [] }],
        "parameters": [{ "$ref": "#/components/parameters/ExactOrigin" }],
        "requestBody": { "required": true, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/CreatePullRequestRequest" } } } },
        "responses": {
          "202": { "description": "Pull request published; projection update is pending", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/PullRequestMutation" } } } },
          "400": { "$ref": "#/components/responses/BadRequest" }, "401": { "$ref": "#/components/responses/Unauthorized" }, "403": { "$ref": "#/components/responses/Forbidden" },
          "404": { "$ref": "#/components/responses/NotFound" }, "409": { "$ref": "#/components/responses/Conflict" }, "422": { "$ref": "#/components/responses/UnprocessableEntity" },
          "502": { "description": "The AT Protocol pull request provider is unavailable", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ErrorResponse" } } } }
        }
      }
    },
    "/api/v1/pull-requests/detail": {
      "get": {
        "operationId": "getPullRequest", "tags": ["Pull Requests"], "summary": "Get one current projected pull request", "security": [],
        "parameters": [{ "$ref": "#/components/parameters/PullRequestURI" }],
        "responses": { "200": { "description": "Current projected pull request", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/PullRequest" } } } }, "404": { "$ref": "#/components/responses/NotFound" }, "422": { "$ref": "#/components/responses/UnprocessableEntity" } }
      }
    },
    "/api/v1/pull-requests/diff": {
      "get": {
        "operationId": "getPullRequestDiff", "tags": ["Pull Requests"], "summary": "Refresh and return a verified pull request diff", "security": [],
        "parameters": [{ "$ref": "#/components/parameters/PullRequestURI" }],
        "responses": {
          "200": { "description": "Verified bounded pull request diff", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/PullRequestDiff" } } } },
          "404": { "$ref": "#/components/responses/NotFound" }, "409": { "$ref": "#/components/responses/Conflict" }, "413": { "description": "Diff exceeds the bounded output limit", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ErrorResponse" } } } }
        }
      }
    },
    "/api/v1/pull-requests/reviews": {
      "get": {
        "operationId": "listPullRequestReviews", "tags": ["Pull Requests"], "summary": "List reviews for the exact current pull request CID", "security": [],
        "parameters": [{ "$ref": "#/components/parameters/PullRequestURI" }],
