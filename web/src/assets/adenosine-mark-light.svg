<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">Adenosine</title>
  <desc id="description">An open letter A connected to three network nodes.</desc>
  <defs>
    <linearGradient id="letter" x1="160" y1="40" x2="390" y2="435" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0a2033" />
      <stop offset="1" stop-color="#173f5b" />
    </linearGradient>
    <linearGradient id="link" x1="85" y1="445" x2="425" y2="145" gradientUnits="userSpaceOnUse">
      <stop stop-color="#526e89" />
      <stop offset="1" stop-color="#7891a9" />
    </linearGradient>
    <radialGradient id="center" cx="0" cy="0" r="1" gradientTransform="translate(258 307) rotate(48) scale(76)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#45dda0" />
      <stop offset="1" stop-color="#20b978" />
    </radialGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#071725" flood-opacity=".2" />
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <g fill="url(#letter)">
      <path d="M222 43h67l69 154-41 55-63-135-88 183h66l-7 23-124 80c-6-3-12-4-18-4-16 1-30 6-41 15l183-91 7-23h-66L222 43Z" />
      <path d="m386 250 82 185h-18l-32-36c-9 1-18 2-27 5l-41-39-18-44 54-71Z" />
    </g>

    <g fill="none" stroke="url(#link)" stroke-linecap="square" stroke-width="22">
      <path d="m81 447 177-125" />
      <path d="m273 311 151-161" />
      <path d="m277 342 126 101" />
    </g>

    <g fill="#7189a1">
      <circle cx="81" cy="447" r="36" />
      <circle cx="424" cy="149" r="36" />
      <circle cx="403" cy="443" r="36" />
    </g>

    <circle cx="266" cy="323" r="41" fill="url(#center)" />
  </g>
